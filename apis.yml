name: Percent
description: >-
  Percent is a private credit platform that opens privately negotiated loans and
  debt financing from non-bank lenders to accredited and institutional investors,
  specialty-finance borrowers, and debt underwriters. The marketplace lets
  individual accredited investors access institutional-grade private credit deals
  (asset-backed securities and corporate loans) with entry points from $500 for
  direct deals, $5,000 for diversified Blended Notes, and $50,000 for Separately
  Managed Accounts, alongside a secondary market for eligible positions. Percent
  Securities, LLC is a U.S. registered broker-dealer and member of FINRA and SIPC;
  Percent Advisors LLC provides advisory services. Investor, borrower, and manager
  workflows run through authenticated portals; the public percent.com surface is
  marketing, education, performance, and regulatory disclosure. Percent has no
  public developer API — programmatic/deal-level access is not published.
